name: Campaign 3 Full Extraction ALL (descriptif seq188-189)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/campaign03_all.txt"]
permissions: { contents: write }
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q duckdb "kaggle==1.6.17" six gdown pytz requests pandas numpy
      - name: Verifier la chaine et la validation temporelle avant calcul
        run: |
          python3 ci_tools/ledger_chain.py verify | grep -q "chaine valide" || { echo "CHAINE INVALIDE"; exit 1; }
          python3 ci_tools/campaign03_temporal_tests.py || { echo "VALIDATION TEMPORELLE KO"; exit 1; }
      - name: Extraction complete (descriptif)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p reports/meta_alpha/campaign03
          python3 -u ci_tools/campaign03_engine.py > reports/meta_alpha/campaign03/CI_LOG.txt 2>&1 || true
          tail -5 reports/meta_alpha/campaign03/CI_LOG.txt
      - name: Commit resultats (toujours)
        if: always()
        run: |
          set -x
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la reports/meta_alpha/campaign03 || true
          git add reports/meta_alpha/campaign03 || true
          git diff --cached --stat || true
          if git diff --cached --quiet; then echo "RIEN A COMMITER"; exit 0; fi
          git commit -m "Campaign 3: extraction complete ALL (descriptif brut)"
          for i in 1 2 3 4 5; do
            git fetch origin arena/afe12737-xauusd-quant-research || true
            git rebase origin/arena/afe12737-xauusd-quant-research || git rebase --abort || true
            if git push origin HEAD:arena/afe12737-xauusd-quant-research; then echo "PUSH OK"; exit 0; fi
            sleep 20
          done
          echo "PUSH KO APRES 5 ESSAIS"; exit 1
