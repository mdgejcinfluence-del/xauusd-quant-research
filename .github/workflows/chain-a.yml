name: Chaine A (reutilisable) - produit un checkpoint
on:
  workflow_call: {}
permissions: { contents: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - run: |
          mkdir -p reports/meta_alpha/chain
          echo "A termine a $(date -u +%Y-%m-%dT%H:%M:%SZ), run $GITHUB_RUN_ID" > reports/meta_alpha/chain/CHAIN_PROOF.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/chain; git commit -q -m "Chaine A: checkpoint produit"
          git pull --rebase -q origin arena/afe12737-xauusd-quant-research || true
          git push -q origin HEAD:arena/afe12737-xauusd-quant-research
