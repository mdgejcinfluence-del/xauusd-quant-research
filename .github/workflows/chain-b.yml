name: Chaine B (reutilisable) - consomme le checkpoint de A
on:
  workflow_call: {}
permissions: { contents: write }
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - run: |
          test -f reports/meta_alpha/chain/CHAIN_PROOF.txt || { echo "ECHEC: checkpoint de A absent"; exit 1; }
          echo "B termine a $(date -u +%Y-%m-%dT%H:%M:%SZ), apres lecture du checkpoint de A" >> reports/meta_alpha/chain/CHAIN_PROOF.txt
          cat reports/meta_alpha/chain/CHAIN_PROOF.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/chain; git commit -q -m "Chaine B: checkpoint de A consomme, enchainement prouve"
          git pull --rebase -q origin arena/afe12737-xauusd-quant-research || true
          git push -q origin HEAD:arena/afe12737-xauusd-quant-research
