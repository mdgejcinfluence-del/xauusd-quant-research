name: ERE cycle autonome (etat transfere par Git, aucun secret)
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/ere_cycle.txt"]
permissions: { contents: write }
concurrency:
  group: ere-cycle
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Executer un cycle (missions, meta-recherche si portefeuille vide)
        run: python3 ci_tools/ere_cycle_ci.py
      - name: Commit de l'etat (idempotent)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/ere_state || true
          git diff --cached --quiet && exit 0
          git commit -m "ERE cycle: etat des missions mis a jour"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
