name: ERE GO-LIVE-001 (familles gelees seq521)
on:
  workflow_dispatch: {}
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/ere_golive.txt"]
permissions: { contents: write }
jobs:
  golive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q gdown pandas pyarrow numpy requests
      - name: Campagne GO-LIVE-001 (post-impulsion, representation, regimes)
        run: python3 ci_tools/ere_golive_ci.py
      - name: Commit resultats (toujours)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkpoints/GO_LIVE_001 || true
          git diff --cached --quiet && exit 0
          git commit -m "GO-LIVE-001: campagne CI (protocole seq521)"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
