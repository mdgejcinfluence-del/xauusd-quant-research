name: Exogenous Pack (ingenierie seule, seq 101)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/exogenous_pack.txt"]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas pyarrow requests kaggle six
      - name: Verifier la chaine avant calcul
        run: python3 ci_tools/ledger_chain.py verify | grep -q "chaine valide" || { echo "CHAINE INVALIDE"; exit 1; }
      - name: Collecte (ingenierie seule)
        run: python3 ci_tools/exogenous_collect.py
      - name: Publication Kaggle scellee par perimetre
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python3 ci_tools/exogenous_upload.py
      - name: Commit certification (toujours)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/exogenous || true
          git diff --cached --quiet && exit 0
          git commit -m "EXOGENOUS PACK: certification, manifestes, VERIFY (bruts)"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
