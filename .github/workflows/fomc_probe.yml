name: FOMC Probe (ingenierie)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/fomc_probe.txt"]
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests
      - run: python3 ci_tools/fomc_probe.py
