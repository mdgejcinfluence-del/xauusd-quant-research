name: Inventaire exhaustif 348 (lecture seule, footers)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/inventory348_exhaustive.txt"]
permissions: { contents: write }
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests pyarrow
      - run: python3 ci_tools/inventory348_exhaustive.py
      - name: Commit inventaire (toujours, meme partiel)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/INVENTORY_348_EXHAUSTIVE.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Inventaire exhaustif 348 partitions: footers, stats temporelles, signatures (lecture seule)"
          git push origin HEAD:arena/afe12737-xauusd-quant-research
