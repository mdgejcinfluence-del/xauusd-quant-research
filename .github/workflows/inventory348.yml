name: Inventory 348 partitions (footers Range)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/inventory348.txt"]
permissions: { contents: write }
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests pyarrow
      - name: Run full footer inventory
        run: |
          mkdir -p reports/meta_alpha
          python3 ci_tools/inventory348.py
      - name: Commit inventory
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/INVENTORY_348.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Inventaire complet 348 partitions: footers, lignes totales, signatures de schema"
          git push origin HEAD:arena/afe12737-xauusd-quant-research
