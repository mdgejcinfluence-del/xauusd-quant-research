name: Kaggle Verification distante
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/kaggle_verify.txt"]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  kv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q kaggle six
      - name: Verifier les lots Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python3 ci_tools/kaggle_verify.py
      - name: Commit verification (toujours)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/kaggle_migration || true
          git diff --cached --quiet && exit 0
          git commit -m "Kaggle: verification distante (secours)"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
