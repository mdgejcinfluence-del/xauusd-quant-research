name: NR Collect (Phase 8)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/nr_collect.txt"]
  schedule:
    - cron: "10 14 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas pyarrow requests kaggle six
      - name: Verifier la chaine avant calcul
        run: python3 ci_tools/ledger_chain.py verify | grep -q "chaine valide" || { echo "CHAINE INVALIDE"; exit 1; }
      - name: Collecte NR (S1/S2/S3)
        run: python3 ci_tools/nr_collect.py
      - name: Upload lake Kaggle (holdout scelle, upload seul)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: python3 ci_tools/nr_upload.py
      - name: Commit manifestes et donnees IS/VALID (toujours)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/nr || true
          git diff --cached --quiet && exit 0
          git commit -m "NR COLLECT: manifeste, IS/VALID, spreads (bruts)"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
