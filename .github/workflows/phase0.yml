name: Phase 0 hygiene corpus IS (lecture seule)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/phase0.txt"]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q gdown duckdb pytz requests
      - run: python3 ci_tools/phase0.py
      - name: Commit resultats (toujours)
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/phase0 || true
          git diff --cached --quiet && exit 0
          git commit -m "Phase 0: hygiene/checkpoint (lecture seule, conservee)"
          git pull --rebase origin arena/afe12737-xauusd-quant-research || true
          git push origin HEAD:arena/afe12737-xauusd-quant-research
