name: phase10_all
'on':
  workflow_dispatch:
    inputs:
      synth_only:
        description: Synthese seule depuis les artefacts du run moteur 44919631588
        type: boolean
        default: false
jobs:
  run0:
    name: P10 moteur 2013 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache0
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2013-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2013
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ !inputs.synth_only }}
  run1:
    name: P10 moteur 2016 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache1
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2016-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2016
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ !inputs.synth_only }}
  run2:
    name: P10 moteur 2020 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache2
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2020-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2020
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ !inputs.synth_only }}
  synthese:
    name: P10 synthese portes+BY
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    needs:
    - run0
    - run1
    - run2
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy scipy
    - name: Recuperer les lots (run courant)
      if: ${{ !inputs.synth_only }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: artifacts
        merge-multiple: true
    - name: Recuperer les lots (run moteur 44919631588)
      if: ${{ inputs.synth_only }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: artifacts
        merge-multiple: true
        run-id: 44919631588
        github-token: ${{ github.token }}
    - name: Fusionner les lots
      run: 'python - <<''PYEOF''

        import glob, pathlib, pandas as pd

        fs=sorted(glob.glob(''artifacts/**/PHASE10_EVENTS.csv.gz'', recursive=True))

        print(''lots'', fs)

        dfs=[pd.read_csv(f) for f in fs]

        ev=pd.concat(dfs).drop_duplicates(subset=[''famille'',''t_signal'',''t_entree'']).sort_values(''t_signal'')
        if dfs else pd.DataFrame()

        pathlib.Path(''reports/meta_alpha/phase10'').mkdir(parents=True, exist_ok=True)

        ev.round(4).to_csv(''reports/meta_alpha/phase10/PHASE10_EVENTS.csv.gz'', index=False,
        compression=''gzip'')

        print(''evenements fusionnes'', len(ev))

        PYEOF'
    - name: Portes avant inference, BY m=6
      run: python ci_tools/phase10_synthesize.py 2>&1 | tee reports/meta_alpha/phase10/SYNTH_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les resultats Phase 10 dans le depot
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase10/

        git status --porcelain

        git diff --cached --quiet || git commit -m ''Phase 10: resultats synthese
        (run synthese seule)''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
    - name: Publier les resultats Phase 10
      uses: actions/upload-artifact@v4
      with:
        name: p10-synth
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
      if: always()
    if: ${{ always() && (inputs.synth_only || (needs.run0.result == 'success' && needs.run1.result
      == 'success' && needs.run2.result == 'success')) }}
