name: phase10_all
on:
  workflow_dispatch: {}
jobs:
  run0:
    name: P10 moteur 2013 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CACHE_HIT: ${{ steps.cache0.outputs.cache-hit }}
    steps:
    - uses: actions/checkout@v4
    - id: cache0
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2013-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2013
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
  run1:
    name: P10 moteur 2016 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CACHE_HIT: ${{ steps.cache1.outputs.cache-hit }}
    steps:
    - uses: actions/checkout@v4
    - id: cache1
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2016-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2016
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
  run2:
    name: P10 moteur 2020 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CACHE_HIT: ${{ steps.cache2.outputs.cache-hit }}
    steps:
    - uses: actions/checkout@v4
    - id: cache2
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2020-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2020
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
  synthese:
    name: P10 synthese portes+BY
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    needs:
    - run0
    - run1
    - run2
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy scipy
    - name: Recuperer les lots
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: artifacts
        merge-multiple: true
    - name: Fusionner les lots
      run: "python - <<'PYEOF'\nimport glob, pathlib, pandas as pd\nfs=sorted(glob.glob('artifacts/PHASE10_EVENTS.csv.gz'))\n\
        print('lots', fs)\nif fs:\n    ev=pd.concat([pd.read_csv(f) for f in fs]).drop_duplicates(subset=['famille','t_signal','t_entree']).sort_values('t_signal')\n\
        \    pathlib.Path('reports/meta_alpha/phase10').mkdir(parents=True, exist_ok=True)\n\
        \    ev.round(4).to_csv('reports/meta_alpha/phase10/PHASE10_EVENTS.csv.gz',\
        \ index=False, compression='gzip')\n    print('evenements fusionnes', len(ev))\n\
        PYEOF"
    - name: Portes avant inference, BY m=6
      run: python ci_tools/phase10_synthesize.py
    - name: Publier les resultats Phase 10
      uses: actions/upload-artifact@v4
      with:
        name: p10-synth
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
