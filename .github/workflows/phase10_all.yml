name: phase10_all
'on':
  workflow_dispatch:
    inputs:
      synth_only:
        description: Synthese seule depuis les artefacts du run moteur 44919631588
        type: boolean
        default: false
      cible:
        description: Relance ciblee F10-01/F10-03 (amendement seq289)
        type: boolean
        default: false
      diag:
        description: Diagnostic acces Kaggle/Drive (journal committe)
        type: boolean
        default: false
      moteurs:
        description: Lancer les moteurs complets (mode historique)
        type: boolean
        default: false
      phase11c:
        description: 'Phase 11-C: anatomie des mouvements (seq305)'
        type: boolean
        default: false
      phase12b:
        description: 'Phase 12-B: extraction bornee et evaluation predictive (seq312)'
        type: boolean
        default: false
      phase12c2:
        description: 'Phase 12-C.2: confirmation holdout H1 (seq318)'
        type: boolean
        default: false
      probe12c2r:
        description: 'Phase 12-C.2-R: sonde acces authentifie Drive/Kaggle (seq320, metadonnees seules)'
        type: boolean
        default: false
      migration12c2r:
        description: 'Phase 12-C.2-R: migration holdout Drive->Kaggle privee (seq320)'
        type: boolean
        default: false
      probe12c2r2:
        description: 'Phase 12-C.2-R2: sonde dossier Drive partage (seq322)'
        type: boolean
        default: false
      drive_folder:
        description: 'Identifiant du dossier Drive partage (jamais commite)'
        type: string
        default: ''
      migration12c2r2:
        description: 'Phase 12-C.2-R2: migration dossier partage -> Kaggle (seq322)'
        type: boolean
        default: false
      phase12c2r3:
        description: 'Phase 12-C.2-R3: verification 66/66 Kaggle puis confirmation H1 (seq324)'
        type: boolean
        default: false
jobs:
  run0:
    name: P10 moteur 2013 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache0
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2013-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
      env:
        P10_CIBLE: ${{ inputs.cible && '1' || '0' }}
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2013
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ inputs.moteurs && !inputs.synth_only && !inputs.cible }}
  run1:
    name: P10 moteur 2016 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache1
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2016-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
      env:
        P10_CIBLE: ${{ inputs.cible && '1' || '0' }}
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2016
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ inputs.moteurs && !inputs.synth_only && !inputs.cible }}
  run2:
    name: P10 moteur 2020 (repris C8)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - id: cache2
      uses: actions/cache@v4
      with:
        path: ~/.cache/kaggle
        key: p10-c8-2020-kaggle-v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Moteur Phase 10 (partitions IS uniquement, holdout jamais accede)
      run: python ci_tools/phase10_engine.py
      env:
        P10_CIBLE: ${{ inputs.cible && '1' || '0' }}
    - name: Publier PHASE10_EVENTS
      uses: actions/upload-artifact@v4
      with:
        name: p10-events-2020
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
    if: ${{ inputs.moteurs && !inputs.synth_only && !inputs.cible }}
  synthese:
    name: P10 synthese portes+BY
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    needs:
    - run0
    - run1
    - run2
    - lots
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy scipy
    - name: Recuperer les lots (run courant)
      if: ${{ !inputs.synth_only }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: artifacts
        merge-multiple: true
    - name: Recuperer les lots (run moteur 44919631588)
      if: ${{ inputs.synth_only }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: artifacts
        merge-multiple: true
        run-id: 44919631588
        github-token: ${{ github.token }}
    - name: Recuperer les barres des 8 lots
      if: ${{ inputs.cible }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-bars-*
        path: bars_artifacts
        merge-multiple: true
    - name: 'Etape 2: agregation barres et recomputation ciblee F10-01/F10-03'
      if: ${{ inputs.cible }}
      env:
        BARS_DIR: bars_artifacts
      run: python ci_tools/phase10_stage2.py 2>&1 | tee reports/meta_alpha/phase10/STAGE2_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Fusionner les lots
      run: "python - <<'PYEOF'\nimport glob, pathlib, pandas as pd\npathlib.Path('reports/meta_alpha/phase10').mkdir(parents=True,\
        \ exist_ok=True)\nfc=sorted(glob.glob('artifacts/**/PHASE10_EVENTS_CIBLE.csv.gz',\
        \ recursive=True))\nif fc:\n    ev=pd.concat([pd.read_csv(f) for f in fc]).drop_duplicates(subset=['famille','t_signal','t_entree']).sort_values('t_signal')\n\
        \    ev.round(4).to_csv('reports/meta_alpha/phase10/PHASE10_EVENTS_CIBLE.csv.gz',\
        \ index=False, compression='gzip')\n    print('evenements cibles fusionnes',\
        \ len(ev))\nelif pathlib.Path('reports/meta_alpha/phase10/PHASE10_EVENTS_CIBLE.csv.gz').exists():\n\
        \    print('evenements cibles deja produits par l etape 2')\nelse:\n    fs=sorted(glob.glob('artifacts/**/PHASE10_EVENTS.csv.gz',\
        \ recursive=True))\n    dfs=[pd.read_csv(f) for f in fs]\n    ev=pd.concat(dfs).drop_duplicates(subset=['famille','t_signal','t_entree']).sort_values('t_signal')\
        \ if dfs else pd.DataFrame()\n    ev.round(4).to_csv('reports/meta_alpha/phase10/PHASE10_EVENTS.csv.gz',\
        \ index=False, compression='gzip')\n    print('evenements fusionnes', len(ev))\n\
        PYEOF"
    - name: Portes avant inference, BY m=6
      run: python ci_tools/phase10_synthesize.py 2>&1 | tee reports/meta_alpha/phase10/SYNTH_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
      if: ${{ !inputs.cible }}
    - name: Verification des artefacts du run moteur 44919631588
      if: ${{ inputs.cible }}
      uses: actions/download-artifact@v4
      with:
        pattern: p10-events-*
        path: old_artifacts
        merge-multiple: true
        run-id: 44919631588
        github-token: ${{ github.token }}
    - name: Verifier integrite/provenance/couverture des artefacts 44919631588
      if: ${{ inputs.cible }}
      run: "python - <<'PYEOF'\nimport glob, json, pathlib, pandas as pd\nver={'run_moteur':'44919631588'}\n\
        fs=sorted(glob.glob('old_artifacts/**/PHASE10_EVENTS.csv.gz', recursive=True))\n\
        ver['fichiers_evenements']=fs\nref=json.loads(pathlib.Path('reports/meta_alpha/phase10/PHASE10_RESULTS.json').read_text())\n\
        if fs:\n    ev=pd.concat([pd.read_csv(f) for f in fs])\n    compte={k:int(v)\
        \ for k,v in ev.famille.value_counts().items()}\n    ver['evenements_par_famille_artefacts']=compte\n\
        \    ver['concordance_avec_resultats_seq288']={fam: compte.get(fam,0)==ref.get(fam,{}).get('detectes',-1)\
        \ for fam in ref}\n    ver['familles_cibles_avant_correction']={fam: compte.get(fam,0)\
        \ for fam in ('F10-01','F10-03')}\ncovs=sorted(glob.glob('old_artifacts/**/P10_COVERAGE.json',\
        \ recursive=True))\nver['fichiers_couverture']=covs\nif covs:\n    c=json.loads(pathlib.Path(covs[0]).read_text());\
        \ ver['partitions_chargees']=c.get('partitions_chargees'); ver['partitions_attendues']=c.get('partitions_attendues');\
        \ ver['barres_tf']=c.get('barres_tf')\nver['conclusion']='Artefacts evenementiels\
        \ integres et concordants; ils ne contiennent pas les series de barres: recomputation\
        \ ciblee F10-01/F10-03 sur le meme corpus IS (amendement seq289, section C).'\n\
        pathlib.Path('reports/meta_alpha/phase10/CORRECTION_ARTIFACT_VERIFICATION.json').write_text(json.dumps(ver,\
        \ indent=1))\nprint(json.dumps(ver, indent=1))\nPYEOF"
    - name: Synthese corrective F10-01/F10-03 (portes, BY m=6)
      if: ${{ inputs.cible }}
      run: python ci_tools/phase10_synthesize_correction.py 2>&1 | tee reports/meta_alpha/phase10/CORRECTION_SYNTH_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les resultats Phase 10 dans le depot
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase10/

        git status --porcelain

        git diff --cached --quiet || git commit -m ''Phase 10: resultats synthese
        (run synthese seule)''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
    - name: Publier les resultats Phase 10
      uses: actions/upload-artifact@v4
      with:
        name: p10-synth
        path: reports/meta_alpha/phase10
        retention-days: 90
        if-no-files-found: error
      if: always()
    if: ${{ always() && (inputs.synth_only || needs.lots.result == 'success' || (needs.run0.result
      == 'success' && needs.run1.result == 'success' && needs.run2.result == 'success'))
      }}
  lots:
    name: P10 lot ${{ matrix.batch }} (barres M1)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.cible || inputs.phase11c || inputs.phase12b }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        batch:
        - xauusd-is-b01
        - xauusd-is-b02
        - xauusd-is-b03
        - xauusd-is-b04
        - xauusd-is-b05
        - xauusd-is-b06
        - xauusd-is-b07
        - xauusd-is-missing13
      fail-fast: false
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy pyarrow duckdb gdown kaggle
    - name: Tests temporels synthetiques
      run: python ci_tools/phase10_temporal_tests.py
    - name: Barres M1 du lot (partitions IS uniquement, holdout jamais accede)
      env:
        P10_ETAPE: bars
        P10_BATCH: ${{ matrix.batch }}
      run: python ci_tools/phase10_engine.py
    - name: Publier les barres du lot
      uses: actions/upload-artifact@v4
      with:
        name: p10-bars-${{ matrix.batch }}
        path: reports/meta_alpha/phase10/P10_BARS_${{ matrix.batch }}.csv.gz
        retention-days: 90
        if-no-files-found: error
  diag:
    name: P10 diagnostic acces sources
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.diag }}
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q requests gdown
    - name: Diagnostic (journal committe dans le depot)
      run: 'python ci_tools/phase10_diag.py 2>&1 | tee reports/meta_alpha/phase10/DIAG_ACCESS_LOG.txt;
        git config user.email ''actions@github.com''; git config user.name ''github-actions'';
        git add reports/meta_alpha/phase10/DIAG_ACCESS_LOG.txt; git diff --cached
        --quiet || git commit -m ''Phase 10: diagnostic acces sources''; git push
        origin HEAD:arena/afe12737-xauusd-quant-research'
  analyse11c:
    name: P11-C anatomie H1/H4 (protocole gele seq300, seq305)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ inputs.phase11c }}
    needs:
    - lots
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy
    - name: Recuperer les barres des 8 lots
      uses: actions/download-artifact@v4
      with:
        pattern: p10-bars-*
        path: bars_artifacts
        merge-multiple: true
    - name: Analyse anatomique Phase 11-C
      env:
        BARS_DIR: bars_artifacts
      run: python ci_tools/phase11c_engine.py 2>&1 | tee reports/meta_alpha/phase11/PHASE11C_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les livrables Phase 11-C
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase11/

        git status --porcelain

        git diff --cached --quiet || git commit -m ''Phase 11-C: livrables analyse
        anatomique (run CI)''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
      if: always()
    - name: Publier les livrables
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p11c-livrables
        path: reports/meta_alpha/phase11
        retention-days: 90
        if-no-files-found: warn
  analyse12b:
    name: P12-B extraction bornee + evaluation predictive (protocole gele 12-A, seq312)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ inputs.phase12b }}
    needs:
    - lots
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy
    - name: Recuperer les barres des 8 lots
      uses: actions/download-artifact@v4
      with:
        pattern: p10-bars-*
        path: bars_artifacts
        merge-multiple: true
    - name: Tests synthetiques temporels Phase 12-B
      run: python ci_tools/phase12b_temporal_tests.py
    - name: Extraction bornee et evaluation Phase 12-B
      env:
        BARS_DIR: bars_artifacts
      run: python ci_tools/phase12b_engine.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12B_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les livrables Phase 12-B
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git status --porcelain

        git diff --cached --quiet || git commit -m ''Phase 12-B: livrables extraction bornee et evaluation (run CI)''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
      if: always()
    - name: Publier les livrables
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p12b-livrables
        path: reports/meta_alpha/phase12
        retention-days: 90
        if-no-files-found: warn

  lots12c2:
    name: P12C2 lot ${{ matrix.lot }} (barres M1 holdout)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.phase12c2 }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - { lot: h01, parts: '282-290' }
        - { lot: h02, parts: '291-299' }
        - { lot: h03, parts: '300-308' }
        - { lot: h04, parts: '309-317' }
        - { lot: h05, parts: '318-326' }
        - { lot: h06, parts: '327-335' }
        - { lot: h07, parts: '336-342' }
        - { lot: h08, parts: '343-348' }
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy duckdb gdown
    - name: Barres M1 du lot (holdout autorise seq318)
      env:
        P12C2_ETAPE: bars
        P12C2_LOT: ${{ matrix.lot }}
        P12C2_PARTS: ${{ matrix.parts }}
      run: python ci_tools/phase12c2_engine.py 2>&1 | tee reports/meta_alpha/phase12/P12C2_LOTLOG_${{ matrix.lot }}.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer le journal du lot
      if: always()
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git diff --cached --quiet || git commit -m ''Phase 12-C.2: journal du lot ${{ matrix.lot }}''

        for i in 1 2 3 4 5; do git pull -q --rebase origin arena/afe12737-xauusd-quant-research && git push -q origin HEAD:arena/afe12737-xauusd-quant-research && break || sleep 15; done'
    - name: Publier les barres du lot
      uses: actions/upload-artifact@v4
      with:
        name: p12c2-bars-${{ matrix.lot }}
        path: reports/meta_alpha/phase12/P12C2_BARS_${{ matrix.lot }}.csv.gz
        retention-days: 90
        if-no-files-found: error
  analyse12c2:
    name: P12C2 evaluation unique H1 (modele gele 12-C.1)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.phase12c2 }}
    needs:
    - lots12c2
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy
    - name: Recuperer les barres des 8 lots
      uses: actions/download-artifact@v4
      with:
        pattern: p12c2-bars-*
        path: bars_artifacts
        merge-multiple: true
    - name: Evaluation terminale unique Phase 12-C.2
      env:
        BARS_DIR: bars_artifacts
      run: python ci_tools/phase12c2_engine.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les livrables Phase 12-C.2
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git status --porcelain

        git diff --cached --quiet || git commit -m ''Phase 12-C.2: livrables confirmation holdout H1 (run CI)''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
      if: always()
    - name: Publier les livrables
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p12c2-livrables
        path: reports/meta_alpha/phase12
        retention-days: 90
        if-no-files-found: warn

  probe12c2r:
    name: P12C2-R sonde acces authentifie (metadonnees seules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.probe12c2r }}
    permissions:
      contents: write
    env:
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy google-api-python-client google-auth requests
    - name: Sonde (aucun contenu, aucun secret affiche)
      env:
        P12C2R_MODE: probe
      run: python ci_tools/phase12c2_migrate.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2_PROBE_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer la sonde
      if: always()
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git diff --cached --quiet || git commit -m ''Phase 12-C.2-R: sonde acces authentifie''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
  migration12c2r:
    name: P12C2-R migration lot ${{ matrix.lot }} Drive->Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.migration12c2r }}
    permissions:
      contents: write
    env:
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        lot: [b01, b02, b03, b04, b05, b06]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy google-api-python-client google-auth kaggle requests
    - name: Migration et verification du lot
      env:
        P12C2R_MODE: lot
        P12C2R_LOT: ${{ matrix.lot }}
      run: python ci_tools/phase12c2_migrate.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2_MIGRATION_LOG_${{ matrix.lot }}.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les preuves du lot (aucune donnee)
      if: always()
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git diff --cached --quiet || git commit -m ''Phase 12-C.2-R: preuves migration lot ${{ matrix.lot }}''

        for i in 1 2 3 4 5; do git pull -q --rebase origin arena/afe12737-xauusd-quant-research && git push -q origin HEAD:arena/afe12737-xauusd-quant-research && break || sleep 15; done'

  probe12c2r2:
    name: P12C2-R2 sonde dossier Drive partage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.probe12c2r2 }}
    permissions:
      contents: write
    env:
      DRIVE_FOLDER_ID: ${{ inputs.drive_folder }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q gdown kaggle requests
    - name: Sonde dossier partage (lecture seule)
      run: python ci_tools/phase12c2r2_probe.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2R2_PROBE_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer la sonde
      if: always()
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git diff --cached --quiet || git commit -m ''Phase 12-C.2-R2: sonde dossier Drive partage''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'

  verif12c2r3:
    name: P12C2-R3 verification cryptographique 66/66 Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.phase12c2r3 }}
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances (six requis par le CLI Kaggle)
      run: pip install -q pandas numpy requests six kaggle && python -c "import six; print('six', six.__version__)"
    - name: Verification 66/66 (lecture seule Kaggle)
      run: python ci_tools/phase12c2r3_verify.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2R3_VERIFY_LOG.txt;
        test ${PIPESTATUS[0]} -eq 0
    - name: Committer les preuves de verification
      if: always()
      run: 'git config user.email ''actions@github.com''

        git config user.name ''github-actions''

        git add -A reports/meta_alpha/phase12/

        git diff --cached --quiet || git commit -m ''Phase 12-C.2-R3: preuves de verification 66/66''

        git push origin HEAD:arena/afe12737-xauusd-quant-research'
  lots12c2r3:
    name: P12C2-R3 lot ${{ matrix.lot }} (barres M1 depuis Kaggle verifie)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.phase12c2r3 }}
    needs:
    - verif12c2r3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - { lot: ctx, parts: '282-282', dataset: 'shalom5123/xauusd-is-missing13' }
        - { lot: hb01, parts: '283-293', dataset: 'shalom5123/xauusd-ho-b01' }
        - { lot: hb02, parts: '294-304', dataset: 'shalom5123/xauusd-ho-b02' }
        - { lot: hb03, parts: '305-315', dataset: 'shalom5123/xauusd-ho-b03' }
        - { lot: hb04, parts: '316-326', dataset: 'shalom5123/xauusd-ho-b04' }
        - { lot: hb05, parts: '327-337', dataset: 'shalom5123/xauusd-ho-b05' }
        - { lot: hb06, parts: '338-348', dataset: 'shalom5123/xauusd-ho-b06' }
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Installer dependances legeres
      run: pip install -q pandas numpy duckdb requests six
    - name: Barres M1 du lot (source Kaggle verifiee seq324)
      env:
        P12C2_ETAPE: bars
        P12C2_LOT: ${{ matrix.lot }}
        P12C2_PARTS: ${{ matrix.parts }}
        P12C2_SOURCE_DATASET: ${{ matrix.dataset }}
      run: python ci_tools/phase12c2_engine.py
    - name: Publier les barres du lot
      uses: actions/upload-artifact@v4
      with:
        name: p12c2r3-bars-${{ matrix.lot }}
        path: |
          reports/meta_alpha/phase12/P12C2_BARS_${{ matrix.lot }}.csv.gz
          reports/meta_alpha/phase12/P12C2_PROVENANCE_${{ matrix.lot }}.json
        retention-days: 90
        if-no-files-found: error
  analyse12c2r3:
    name: P12C2-R3 confirmation unique H1 (modele gele 12-C.1)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.phase12c2r3 }}
    needs:
    - lots12c2r3
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -q pandas numpy scipy
    - name: Recuperer les barres des 7 lots
      uses: actions/download-artifact@v4
      with:
        pattern: p12c2r3-bars-*
        path: bars_artifacts
        merge-multiple: true
    - name: Confirmation terminale unique Phase 12-C.2
      env:
        BARS_DIR: bars_artifacts
      run: |
        set +e
        python ci_tools/phase12c2_engine.py 2>&1 | tee reports/meta_alpha/phase12/PHASE12C2_LOG.txt
        ec=${PIPESTATUS[0]}
        echo "$ec" > reports/meta_alpha/phase12/PHASE12C2_ENGINE_EXIT.txt
        exit $ec
    - name: Committer les livrables Phase 12-C.2 (robuste)
      if: always()
      run: |
        mkdir -p /tmp/p12out && cp -a reports/meta_alpha/phase12/. /tmp/p12out/
        git fetch origin arena/afe12737-xauusd-quant-research
        git reset --hard origin/arena/afe12737-xauusd-quant-research
        cp -a /tmp/p12out/. reports/meta_alpha/phase12/
        git config user.email 'actions@github.com'
        git config user.name 'github-actions'
        git add -A reports/meta_alpha/phase12/
        git status --porcelain
        git diff --cached --quiet || git commit -m 'Phase 12-C.2 (R3): livrables confirmation holdout H1 (run CI)'
        git push origin HEAD:arena/afe12737-xauusd-quant-research
    - name: Publier les livrables
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p12c2r3-livrables
        path: reports/meta_alpha/phase12
        retention-days: 90
        if-no-files-found: warn
