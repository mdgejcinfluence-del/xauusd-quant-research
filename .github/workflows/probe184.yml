name: Re-sonde partition 000184 (erreur reseau transitoire)
on:
  push:
    branches: ["arena/afe12737-xauusd-quant-research"]
    paths: ["import_trigger/probe184.txt"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: arena/afe12737-xauusd-quant-research }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pyarrow gdown
      - run: |
          mkdir -p reports/meta_alpha /tmp/p
          gdown --output /tmp/p/part_000184.parquet 11TKJcp1Aj7n0kQY_bUBJb2yfPVq5ROdp
          python3 - <<'PY'
          import pyarrow.parquet as pq, json, hashlib, pathlib
          p=pathlib.Path('/tmp/p/part_000184.parquet'); f=pq.ParquetFile(str(p)); md=f.metadata
          out={"name":"part_000184.parquet","drive_id":"11TKJcp1Aj7n0kQY_bUBJb2yfPVq5ROdp","bytes":p.stat().st_size,
          "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"rows":md.num_rows,"row_groups":md.num_row_groups,
          "schema":[{"name":f.schema_arrow.names[i],"type":str(f.schema_arrow.types[i])} for i in range(len(f.schema_arrow.names))]}
          pathlib.Path('reports/meta_alpha/PROBE_000184.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta_alpha/PROBE_000184.json
          git diff --cached --quiet && exit 0
          git commit -m "Re-sonde partition 000184: footer lu directement (cloture inventaire 348/348)"
          git push origin HEAD:arena/afe12737-xauusd-quant-research
