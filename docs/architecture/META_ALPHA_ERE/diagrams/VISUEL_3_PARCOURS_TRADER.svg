<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250"><style>
text{font-family:DejaVu Sans,Arial,sans-serif} .t{font-size:15px;font-weight:bold;fill:#123}
.b{fill:#eef4fb;stroke:#2b5aa6;stroke-width:1.5;rx:8} .g{fill:#eaf7ee;stroke:#2e7d46;stroke-width:1.5}
.o{fill:#fff4e6;stroke:#b26a00;stroke-width:1.5} .r{fill:#fdecec;stroke:#a62b2b;stroke-width:1.5}
.s{font-size:10.5px;fill:#333} .h{font-size:12.5px;font-weight:bold;fill:#123}
line,path{stroke:#444;stroke-width:1.4;fill:none} .cap{font-size:10px;fill:#666;font-style:italic}
</style><text x="18" y="26" class="t">Parcours complet d'un trader: de 4 transactions au modèle économique</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker></defs><rect x="15" y="80" width="140" height="84" class="b"/><text x="85.0" y="100" text-anchor="middle" class="h">4 transactions</text><text x="85.0" y="114" text-anchor="middle" class="s">XAUUSD + bio courte</text><text x="85.0" y="128" text-anchor="middle" class="s">+2000%, DD annoncé 10%</text><path d="M155,122 L170,122" marker-end="url(#ah)"/><rect x="170" y="80" width="140" height="84" class="b"/><text x="240.0" y="100" text-anchor="middle" class="h">Faits observables</text><text x="240.0" y="114" text-anchor="middle" class="s">sens, délais, volumes,</text><text x="240.0" y="128" text-anchor="middle" class="s">durées, prix</text><path d="M310,122 L325,122" marker-end="url(#ah)"/><rect x="325" y="80" width="140" height="84" class="g"/><text x="395.0" y="100" text-anchor="middle" class="h">3 hypothèses</text><text x="395.0" y="114" text-anchor="middle" class="s">récupération d'inventaire,</text><text x="395.0" y="128" text-anchor="middle" class="s">liquidité, momentum</text><path d="M465,122 L480,122" marker-end="url(#ah)"/><rect x="480" y="80" width="140" height="84" class="g"/><text x="550.0" y="100" text-anchor="middle" class="h">Expériences</text><text x="550.0" y="114" text-anchor="middle" class="s">signatures discriminantes</text><text x="550.0" y="128" text-anchor="middle" class="s">protocoles gelés</text><path d="M620,122 L635,122" marker-end="url(#ah)"/><rect x="635" y="80" width="140" height="84" class="o"/><text x="705.0" y="100" text-anchor="middle" class="h">Preuves corpus</text><text x="705.0" y="114" text-anchor="middle" class="s">phénomène mesuré</text><text x="705.0" y="128" text-anchor="middle" class="s">ou réfuté, queue chiffrée</text><path d="M775,122 L790,122" marker-end="url(#ah)"/><rect x="790" y="80" width="140" height="84" class="o"/><text x="860.0" y="100" text-anchor="middle" class="h">Verdict</text><text x="860.0" y="114" text-anchor="middle" class="s">modèle identifié, borné</text><text x="860.0" y="128" text-anchor="middle" class="s">ou NON DÉMONTRABLE</text><text x="20" y="200" class="cap">Chaque étape porte son niveau de preuve — aucun saut de "comportement observé" à "rentabilité".</text><text x="20" y="220" class="cap">Réussite scientifique possible: "trois mécanismes compatibles, voici les expériences qui les départageraient".</text></svg>