</style><text x="18" y="26" class="t">Cycle autonome de recherche</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker></defs><rect x="320" y="60" width="240" height="64" class="b"/><text x="440.0" y="80" text-anchor="middle" class="h">QUESTION</text><text x="440.0" y="94" text-anchor="middle" class="s">Hypothèses concurrentes</text><text x="440.0" y="108" text-anchor="middle" class="s">prédictions divergentes</text><rect x="640" y="150" width="240" height="64" class="g"/><text x="760.0" y="170" text-anchor="middle" class="h">SÉLECTION</text><text x="760.0" y="184" text-anchor="middle" class="s">Expérience au meilleur</text><text x="760.0" y="198" text-anchor="middle" class="s">rapport information/coût</text><rect x="320" y="240" width="240" height="64" class="g"/><text x="440.0" y="260" text-anchor="middle" class="h">PRÉENREGISTREMENT</text><text x="440.0" y="274" text-anchor="middle" class="s">Protocole gelé, hash</text><text x="440.0" y="288" text-anchor="middle" class="s">critères pré-déclarés</text><rect x="20" y="150" width="240" height="64" class="o"/><text x="140.0" y="170" text-anchor="middle" class="h">EXÉCUTION</text><text x="140.0" y="184" text-anchor="middle" class="s">Segment autorisé</text><text x="140.0" y="198" text-anchor="middle" class="s">calculs + tests</text><rect x="320" y="150" width="220" height="64" class="r"/><text x="430.0" y="170" text-anchor="middle" class="h">VERDICT</text><text x="430.0" y="184" text-anchor="middle" class="s">Éliminer, borner</text><text x="430.0" y="198" text-anchor="middle" class="s">ou NON DÉMONTRABLE</text><path d="M560,92 L700,150" marker-end="url(#ah)"/><path d="M700,214 L560,240" marker-end="url(#ah)"/><path d="M320,272 L140,214" marker-end="url(#ah)"/><path d="M140,150 L360,182" marker-end="url(#ah)"/><path d="M430,150 L430,124" marker-end="url(#ah)"/><text x="300" y="350" class="cap">Arrêt légitime: frontière d'identifiab