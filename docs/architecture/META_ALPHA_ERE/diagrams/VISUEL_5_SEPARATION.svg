<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260"><style>
text{font-family:DejaVu Sans,Arial,sans-serif} .t{font-size:15px;font-weight:bold;fill:#123}
.b{fill:#eef4fb;stroke:#2b5aa6;stroke-width:1.5;rx:8} .g{fill:#eaf7ee;stroke:#2e7d46;stroke-width:1.5}
.o{fill:#fff4e6;stroke:#b26a00;stroke-width:1.5} .r{fill:#fdecec;stroke:#a62b2b;stroke-width:1.5}
.s{font-size:10.5px;fill:#333} .h{font-size:12.5px;font-weight:bold;fill:#123}
line,path{stroke:#444;stroke-width:1.4;fill:none} .cap{font-size:10px;fill:#666;font-style:italic}
</style><text x="18" y="26" class="t">Séparation entre identification et exploitation</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker></defs><rect x="20" y="80" width="210" height="110" class="b"/><text x="125.0" y="100" text-anchor="middle" class="h">CE QUE LE TRADER SEMBLE FAIRE</text><text x="125.0" y="114" text-anchor="middle" class="s">Comportements observables: entrées, renforcements, sorties groupées</text><text x="125.0" y="128" text-anchor="middle" class="s"></text><rect x="250" y="80" width="210" height="110" class="g"/><text x="355.0" y="100" text-anchor="middle" class="h">CE QUE CELA PEUT SIGNIFIER</text><text x="355.0" y="114" text-anchor="middle" class="s">Modèles économiques compatibles (plusieurs, toujours)</text><text x="355.0" y="128" text-anchor="middle" class="s"></text><rect x="480" y="80" width="210" height="110" class="o"/><text x="585.0" y="100" text-anchor="middle" class="h">CE QUE LE MARCHÉ DÉMONTRE</text><text x="585.0" y="114" text-anchor="middle" class="s">Signatures mesurées dans notre corpus, queues, coûts</text><text x="585.0" y="128" text-anchor="middle" class="s"></text><rect x="710" y="80" width="210" height="110" class="r"/><text x="815.0" y="100" text-anchor="middle" class="h">CE QUE NOUS EXPLOITONS</text><text x="815.0" y="114" text-anchor="middle" class="s">Nos règles propres — seulement après validation indépendante</text><text x="815.0" y="128" text-anchor="middle" class="s"></text><path d="M230,135 L250,135" marker-end="url(#ah)"/><path d="M460,135 L480,135" marker-end="url(#ah)"/><path d="M690,135 L710,135" marker-end="url(#ah)"/><text x="20" y="230" class="cap">Frontière infranchissable sans preuve: aucune flèche ne saute une zone. Un échec de nos moteurs (V1/V2) condamne notre copie, pas le phénomène.</text></svg>